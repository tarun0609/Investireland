name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The committed lockfile predates the security hardening dependencies.
      # Switch to `npm ci` once package-lock.json has been regenerated.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run lint

      - name: Unit and API tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Validate SEO output
        run: npm run seo:check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true